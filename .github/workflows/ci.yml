name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linting and testing the workspace compiles the desktop crate, which
      # links the system WebView. Without these the build fails at glib-sys
      # long before any lint runs.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every step below compiles the desktop crate, whose build script fails
      # if the native-messaging host is missing from the external-binary
      # directory. The bundling job gets this from the pre-build hook; here it
      # has to be explicit.
      - name: Stage the native-messaging host
        run: node apps/desktop/scripts/prepare-host.mjs

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      # MPL-2.0 is file-level copyleft, so a source file without its notice
      # is a licensing defect, not a style one. Guards the AGPL boundary of
      # the sync server at the same time.
      - name: License headers
        run: python3 scripts/check_license_headers.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/sync-server/go.mod
          cache-dependency-path: apps/sync-server/go.sum

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Rust dependency audit
        run: cargo audit

      # Guards the licence boundary: the clients and shared crates are
      # MPL-2.0, so a GPL/AGPL crate reaching them is a real conflict.
      # Uses the prebuilt action — cargo-deny takes minutes to compile.
      # Advisories are left to cargo-audit above.
      - name: License check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

      - name: JS dependency audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit

      - name: Go vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: apps/sync-server

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Linux desktop packaging: deb + AppImage artifacts.
  # Push-to-main only — the checks job already compiles the workspace per PR,
  # and bundling doubles the Rust build time.
  linux-bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle deb + AppImage
        run: pnpm --dir apps/desktop tauri build --bundles deb appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: typvia-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Windows compile face for the desktop host and the native-messaging
  # host: the registry-based manifest registration is
  # cfg(windows)-only and cannot be cross-checked from macOS/Linux
  # (libsqlite3-sys needs an msvc C toolchain). Push-to-main only, same
  # rationale as linux-bundle.
  windows-check:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The desktop crate declares the native-messaging host as an external
      # binary, and its build script fails if that file is missing. Locally
      # this is staged by the pre-build hook; a bare cargo check has to do it
      # explicitly.
      - name: Stage the native-messaging host
        run: node apps/desktop/scripts/prepare-host.mjs

      - name: Check windows targets
        run: cargo check -p typvia-desktop -p typvia-browser-host
