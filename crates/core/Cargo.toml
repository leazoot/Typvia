[package]
name = "typvia-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# SQLite access library fixed by DEC-005 (bundled build, FTS5 included).
rusqlite = { version = "0.38", features = ["bundled"] }
# KeyboardSnapshot is a versioned JSON document (DEC-007 #4); serde is the
# maintained standard for that boundary (MIT/Apache-2.0, MPL-2.0 compatible).
serde = { version = "1", features = ["derive"] }
# JSON codec for the snapshot document and JSON TEXT columns
# (platform_scope, options; docs/05_DATA_MODEL.md §5.5).
serde_json = "1"
# UUID v4 text primary keys (docs/05_DATA_MODEL.md §5.3); uses OS CSPRNG.
uuid = { version = "1", features = ["v4"] }
# Offline sensitive-pattern detection (PRD §12.10) needs real pattern
# matching; rust-lang maintained, MIT/Apache-2.0, no equivalent in the tree.
regex = "1"
