[package]
name = "typvia-crypto"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Cryptographic primitives: key derivation, AEAD envelopes and the platform secure-store trait"

[lints]
workspace = true

# Algorithms and libraries are fixed by the security model: RustCrypto-
# maintained crates, MIT/Apache-2.0, MPL-2.0 compatible.
[dependencies]
# Argon2id master-password derivation.
argon2 = "0.5"
# XChaCha20-Poly1305 AEAD for record encryption and key wrapping; pulls in
# the OS CSPRNG (rand_core OsRng) used for all keys, salts and nonces.
chacha20poly1305 = "0.10"
# Key material and plaintext buffers are wiped on drop.
zeroize = { version = "1", features = ["zeroize_derive"] }
