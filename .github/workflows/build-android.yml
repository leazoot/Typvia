name: Build Android

# Manual only, and unsigned for the same reason the iOS one is: no keystore
# exists yet, and none may ever live in the repository. What this produces is
# a debug APK — installable on a device or an emulator as it stands, which is
# what makes it worth building at all.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The two ABIs the FFI script builds: the device and the emulator.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # The version the build script expects a toolchain from. It is pinned
      # rather than taken as whatever the image ships, because a different NDK
      # is a different libc and the .so files are the product.
      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      # Gradle's own task would run this, but doing it here keeps the two
      # halves of a failure apart: a Rust cross-compile that fails is not an
      # Android build that fails.
      - name: Build the FFI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: bash crates/mobile-ffi/build-android.sh

      - name: Design system and room rules
        working-directory: apps/android
        run: ./gradlew :core-ui:testDebugUnitTest :app:testDebugUnitTest --console=plain

      - name: Assemble the debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: typvia-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
