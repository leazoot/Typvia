blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/leazoot/Typvia/security/advisories/new
    about: >-
      Never report a vulnerability in a public issue. Use private vulnerability
      reporting under the Security tab. See SECURITY.md for scope and timelines.
  - name: Question or idea
    url: https://github.com/leazoot/Typvia/discussions
    about: >-
      Usage questions, setup help, and open-ended ideas belong in Discussions.
      Bug reports and concrete feature requests belong in issues.
