[package]
name = "typvia-search"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Promoted from dev-dependency now that the search module maintains the
# FTS5 index.
rusqlite = { version = "0.38", features = ["bundled"] }
# Domain models and enum source of truth (dependency direction: search -> core).
typvia-core = { path = "../core" }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "fts5_search"
harness = false

[[bench]]
name = "search_ranking"
harness = false
