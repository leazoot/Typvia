[workspace]
resolver = "2"
# Throwaway spike crates live outside the workspace so root-level quality
# commands stay scoped to formal modules (spike code is exempt from lint).
exclude = ["spikes/injection", "spikes/ffi"]
members = [
    "apps/browser-host",
    "apps/desktop/src-tauri",
    "apps/mobile/src-tauri",
    "crates/ai",
    "crates/core",
    "crates/crypto",
    "crates/search",
    "crates/semantic",
    "crates/sync",
    "crates/template",
    "crates/espanso-adapter",
    "crates/host-service",
    "crates/mobile-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/leazoot/Typvia"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
