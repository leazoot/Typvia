<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Typvia Shell Spike</title>
  </head>
  <body>
    <p id="status">spike page</p>
    <script>
      // SPIKE (TASK-005): reports paint-level readiness back to Rust so window
      // display latency can be measured end to end (show call -> painted frame).
      const invoke = window.__TAURI__.core.invoke;
      const label = window.__TAURI__.webviewWindow.getCurrentWebviewWindow().label;

      function afterPaint(cb) {
        requestAnimationFrame(() => requestAnimationFrame(cb));
      }

      // Cold-start path: windows created on demand report once their first
      // frame is painted.
      if (label.startsWith('cold')) {
        afterPaint(() => invoke('ack_ready', { label }));
      }

      // Resident-hidden path: the pre-created panel acks each show request
      // after the next painted frame.
      window.__TAURI__.event.listen('measure-show', (e) => {
        afterPaint(() => invoke('ack_shown', { seq: e.payload }));
      });
    </script>
  </body>
</html>
