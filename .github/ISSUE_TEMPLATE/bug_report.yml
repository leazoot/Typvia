name: Bug report
description: Report something that is broken or behaves incorrectly.
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        ## Before you paste anything

        **Never put snippet content, passwords, tokens, API keys, private keys, or
        any other secret into a GitHub issue.** Issues are public and permanent —
        editing or deleting a comment does not remove it from the public timeline,
        and anything posted must be treated as compromised.

        Typvia handles exactly the kind of text people should not publish. When you
        need to show a snippet, a template, or a search query, replace the real
        value with an obvious placeholder such as `example-trigger` or
        `AKIA_FAKE_EXAMPLE`. Redact log lines the same way before pasting them.

        **Found a security vulnerability?** Do not open a public issue. Report it
        privately — see `SECURITY.md` for the disclosure process.

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Before you file
      description: Please confirm all of the following.
      options:
        - label: I searched existing issues and this is not already reported.
          required: true
        - label: This report contains no snippet content, passwords, tokens, API keys, or other secrets.
          required: true
        - label: This is a bug report, not a security vulnerability (those go through `SECURITY.md`).
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Where does the problem show up? Pick the closest match.
      options:
        - Desktop app (Windows/macOS)
        - Mobile app (iOS/Android)
        - Keyboard / IME (iOS keyboard extension, Android IME)
        - Browser extension
        - Sync server (self-hosted)
        - Core engine (storage, search, crypto, templates)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: Include the exact version, and the architecture if you know it.
      placeholder: 'macOS 15.3 (Apple Silicon) / Windows 11 23H2 / Android 15 / iOS 18.3'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Typvia version or commit SHA
      description: >-
        The app version if you are running a build, or the commit SHA if you built
        from source. Typvia has no release yet, so a commit SHA is expected.
      placeholder: 'commit a1b2c3d, or 0.1.0-dev'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the steps precisely enough that someone else can follow them.
      placeholder: |
        1. Open the panel with the global shortcut
        2. Type a query that matches two snippets
        3. Press Enter on the second result
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: >-
        What happened instead? Include how often it happens — every time, or
        intermittently.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: >-
        Optional. Redact anything sensitive first. This field is rendered as a code
        block, so no backticks are needed.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >-
        Optional. Screenshots, recordings, related issues, or things you already
        tried. Screenshots must not show real snippet content.
    validations:
      required: false
