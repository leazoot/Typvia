name: Build iOS

# Manual only. The .ipa is built for a real device but left unsigned: no
# Apple Developer certificates exist yet, and none may ever live in the
# repository. An unsigned .ipa will not install as-is — it has to be
# re-signed against an Apple ID first, with the seven-day limit a free
# account carries — but it is a complete device build, which a simulator
# build is not.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Device plus both simulator architectures: the FFI xcframework is
      # assembled from all three before Xcode runs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      # Xcode resolves framework dependency paths before any build phase
      # runs, so the project's own pre-build script cannot create the
      # xcframework on a clean checkout. It has to exist first, and the
      # generated Swift bindings are a source file of the shared module.
      - name: Build the FFI xcframework
        run: bash crates/mobile-ffi/build-xcframework.sh

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Archive unsigned device build
        working-directory: apps/ios
        run: |
          xcodebuild archive \
            -project Typvia.xcodeproj \
            -scheme Typvia \
            -destination 'generic/platform=iOS' \
            -archivePath build/Typvia.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Without a signing identity `xcodebuild -exportArchive` refuses to run,
      # so the package is assembled from the archive by hand. The layout is
      # the one an .ipa actually is: a zip with the app bundle under Payload/.
      - name: Package unsigned .ipa
        working-directory: apps/ios
        run: |
          mkdir -p build/Payload
          cp -R build/Typvia.xcarchive/Products/Applications/Typvia.app build/Payload/
          (cd build && zip -qry Typvia-unsigned.ipa Payload)

      # The package carries Typvia.app with the keyboard, share and widget
      # extensions embedded, and no code signature. Re-sign it against an
      # Apple ID to install it.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: typvia-ios-unsigned
          path: apps/ios/build/Typvia-unsigned.ipa
          if-no-files-found: error
