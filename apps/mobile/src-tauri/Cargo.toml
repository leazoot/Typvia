[package]
name = "typvia-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typvia mobile application shell (Tauri host, iOS first)"
publish = false

[lib]
# Mobile targets link the app as a library (staticlib for iOS, cdylib for
# Android); rlib keeps the desktop `cargo run`/test path working.
name = "typvia_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri build-time codegen: config validation, icon embedding, capability
# schema generation. Required by every Tauri host crate.
tauri-build = { version = "2", features = [] }

[dependencies]
# Deep-link channel for widgets/system entries: the official
# Tauri plugin delivering typvia:// opens to the WebView. MIT/Apache-2.0.
tauri-plugin-deep-link = "2" 
# Application shell (tauri 2.x): the IPC host the mobile
# WebView talks to. No desktop-only features (global shortcut, private APIs).
tauri = { version = "2", features = [] }
# IPC DTO (de)serialization at the WebView boundary; already in the tree.
serde = { version = "1", features = ["derive"] }
# The Rust core this host exposes over IPC (commands parse, call, map errors).
typvia-core = { path = "../../../crates/core" }
# AI provider assembly for the mobile main app: the same crates/ai egress
# gate + un-disableable log the desktop host wires. The keyboard extension
# and IME do not link this crate — they stay zero-AI, zero-network.
typvia-ai = { path = "../../../crates/ai" }
# Same version/features as core: the host owns the Connection it
# hands to repositories, so it needs the type itself.
rusqlite = { version = "0.38", features = ["bundled"] }
# Shared desktop/mobile IPC orchestration layer: the use cases, wire
# DTOs and stable error codes this host exposes over IPC.
typvia-host-service = { path = "../../../crates/host-service" }
# E2EE sync client for the mobile host. host-service must not depend on it,
# so the engine is assembled in each host crate; the mobile host
# needs the same engine, pairing and recovery types the desktop host wires.
typvia-sync = { path = "../../../crates/sync" }
# Serializes the KeyboardSnapshot document written into the App Group
# container; already in the tree via core.
serde_json = "1"
# Stable per-install device id stamped into snapshots; already in the tree
# via core (same version/features).
uuid = { version = "1", features = ["v4"] }
# Wiped buffers for the SecureStore trait surface (retrieve returns
# Zeroizing<Vec<u8>>); already in the tree via crypto/core and the desktop
# host (same version). MIT/Apache-2.0.
zeroize = "1"
# SymmetricKey in the backend-dispatch signatures (webdav revoke/rotate);
# already in the tree — same path dep the desktop host carries.
typvia-crypto = { path = "../../../crates/crypto" }

[target.'cfg(target_os = "android")'.dependencies]
# JNI bridge for the Android SecureStore backend: the Keystore key
# and the BiometricPrompt live in Kotlin (gen/android TypviaSecureStore.kt)
# and Rust calls them / receives the async prompt completion over JNI. Same
# crate and version already in the tree via tao/wry — whose `exec` closures
# hand over a `&mut JNIEnv` of exactly this type — so no new external code
# enters the build. Maintained (jni-rs org), MIT/Apache-2.0.
jni = "0.22"

[target.'cfg(target_os = "ios")'.dependencies]
# Resolves the App Group container via NSFileManager. Security
# application groups have no cross-platform wrapper; this is the same
# maintained objc2 family (MIT/Apache-2.0) the desktop host already uses.
# NSDictionary is the empty options argument of the Settings jump.
# NSArray/NSDate/NSValue carry the UIPasteboard items and expiration/local-only
# option values of the sensitive copy.
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSFileManager",
    "NSString",
    "NSURL",
    "NSValue",
] }
# Base objc2 runtime types (AnyObject, Retained) named in the UIPasteboard
# item/options dictionaries; already in the tree as the foundation
# of the objc2-* bindings and a direct dep of the desktop host (same version,
# MIT/Apache-2.0).
objc2 = "0.6"
# Opens the system Settings app from the onboarding keyboard step:
# keyboard enablement is not programmable, so
# the host can only deep-link Settings via UIApplication openURL. UIKit has
# no cross-platform wrapper; objc2-ui-kit is the smallest maintained binding
# in the objc2 family (MIT/Apache-2.0) already used across the hosts.
# UIPasteboard writes the one-time sensitive copy with the system-enforced
# expiration date — the only auto-clear that survives the app being
# suspended.
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication",
    "UIPasteboard",
    "UIResponder",
] }
# Keychain query construction (CFDictionary/CFData/CFString) for the iOS
# SecureStore backend, same crate and version the desktop host uses for its
# macOS backend. The Security.framework functions are
# declared inline; a biometric prompt plugin (tauri-plugin-biometric) is not
# needed because the userPresence Keychain read itself presents the Face ID
# sheet. Servo-maintained, MIT/Apache-2.0.
core-foundation = "0.10"

[dev-dependencies]
# Isolated on-disk directories for the atomic snapshot writer tests; already
# in the tree via host-service.
tempfile = "3"

[lints]
workspace = true
