name: typvia-mobile
options:
  bundleIdPrefix: dev.typvia.mobile
# Product OS baseline iOS 16.0+; the Tauri default is 14.0 and the technical
# floor is kept only as documented fallback room, not in the shipped project.
  deploymentTarget:
    iOS: "16.0"
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Typvia
      PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
# Formal keyboard extension. Declared as a template because the
# same sources/settings build twice: `typvia-keyboard` is the product target
# embedded in the Typvia app; `typvia-keyboard-harness` is the identical
# clone embedded in the XCUITest host (bundle-id prefix rules require an
# extension id prefixed by its container app id, so one target cannot serve
# both hosts). Regeneration story: `pnpm tauri ios dev/build` does NOT run
# xcodegen (only `tauri ios init` does); after editing this file run
# `xcodegen generate` here so project.yml and the committed xcodeproj stay
# consistent.
  keyboard-ext:
    type: app-extension
    platform: iOS
    sources:
      # Formal Swift sources live in native/ (spike native/ios-keyboard is
      # throwaway and stays untouched).
      - path: ../../../../../native/ios-keyboard-ext/Sources
      # UniFFI-generated Swift bindings, produced (with the xcframework
      # below) by crates/mobile-ffi/build-xcframework.sh into target/.
      # Checked-in relative reference to the reproducible build output —
      # binaries and generated code are never committed. `optional` lets
      # xcodegen run before the first FFI build.
      - path: ../../../../../target/mobile-ffi/generated/typvia_mobile_ffi.swift
        optional: true
    info:
      path: ${target_name}/Info.plist
      properties:
        CFBundleDisplayName: Typvia Keyboard
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Red line: the keyboard never requests full access; the App
            # Group snapshot channel works without it (spike-verified).
            RequestsOpenAccess: false
    entitlements:
      path: ${target_name}/${target_name}.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.typvia.mobile
    settings:
      base:
        PRODUCT_NAME: Typvia Keyboard
        SWIFT_VERSION: "5.9"
        # The generated bindings import the clang module
        # `typvia_mobile_ffiFFI`; Xcode wires it up automatically from the
        # linked xcframework's slice headers (modulemap included), so no
        # extra SWIFT_INCLUDE_PATHS entry is needed (adding one would
        # redefine the module).
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
    dependencies:
      - framework: ../../../../../target/mobile-ffi/TypviaMobileFFI.xcframework
        embed: false
    preBuildScripts:
      - script: |
          # Reproducibility: build the FFI xcframework + Swift bindings only
          # when missing so incremental Xcode builds stay fast. Refresh
          # explicitly with: bash crates/mobile-ffi/build-xcframework.sh
          FFI_OUT="$SRCROOT/../../../../../target/mobile-ffi"
          if [ ! -d "$FFI_OUT/TypviaMobileFFI.xcframework" ] || [ ! -f "$FFI_OUT/generated/typvia_mobile_ffi.swift" ]; then
            cd "$SRCROOT/../../../../.." && bash crates/mobile-ffi/build-xcframework.sh
          fi
        name: Ensure TypviaMobileFFI
        basedOnDependencyAnalysis: false
targets:
  typvia-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: typvia-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: typvia-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Background sync: BGAppRefreshTask registration surface.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.typvia.mobile.refresh]
        # Deep-link channel: the typvia:// custom scheme.
        CFBundleURLTypes:
          - CFBundleURLName: dev.typvia.mobile.deeplink
            CFBundleURLSchemes: [typvia]
    entitlements:
      path: typvia-mobile_iOS/typvia-mobile_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - target: typvia-keyboard
        embed: true
      - target: typvia-share
        embed: true
      - target: typvia-widget
        embed: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # Product keyboard extension, embedded in the Typvia app above.
  typvia-keyboard:
    templates: [keyboard-ext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.keyboard
  # Home/lock-screen widget extension: reads the App Group
  # snapshot and renders the Rust-side `widget_entries` row selection;
  # refresh is event-driven from the host (WidgetReload.swift bridge), the
  # timeline policy is `.never`. Shares PanelTheme.swift with the keyboard
  # extension so tokens and type marks have one Swift source.
  typvia-widget:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../../../../native/ios-widget/Sources
      - path: ../../../../../native/ios-keyboard-ext/Sources/PanelTheme.swift
      - path: ../../../../../target/mobile-ffi/generated/typvia_mobile_ffi.swift
        optional: true
    info:
      path: typvia-widget/Info.plist
      properties:
        CFBundleDisplayName: Typvia
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: typvia-widget/typvia-widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.typvia.mobile
    settings:
      base:
        PRODUCT_NAME: Typvia Widget
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.widget
        SWIFT_VERSION: "5.9"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
    dependencies:
      - framework: ../../../../../target/mobile-ffi/TypviaMobileFFI.xcframework
        embed: false
    preBuildScripts:
      - script: |
          # Same reproducibility rule as the keyboard extension: build the
          # FFI xcframework + bindings only when missing; refresh explicitly
          # with: bash crates/mobile-ffi/build-xcframework.sh
          FFI_OUT="$SRCROOT/../../../../../target/mobile-ffi"
          if [ ! -d "$FFI_OUT/TypviaMobileFFI.xcframework" ] || [ ! -f "$FFI_OUT/generated/typvia_mobile_ffi.swift" ]; then
            cd "$SRCROOT/../../../../.." && bash crates/mobile-ffi/build-xcframework.sh
          fi
        name: Ensure TypviaMobileFFI
        basedOnDependencyAnalysis: false
  # Share extension: saves text shared from other apps by writing
  # one JSON document into the App Group inbox (write-only channel — the
  # extension never opens the database or reads the snapshot; the main app
  # ingests on launch/foreground). Pure Swift, no FFI xcframework needed.
  # XCUITest coverage is deferred (driving the system share sheet is flaky);
  # the demo path is a manually written inbox file + app launch.
  typvia-share:
    type: app-extension
    platform: iOS
    sources:
      # Formal Swift sources live in native/ (spike native/ios-share-extension
      # is throwaway and stays untouched).
      - path: ../../../../../native/ios-share-ext/Sources
    info:
      path: typvia-share/Info.plist
      properties:
        CFBundleDisplayName: Typvia
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text-only activation: the sheet appears for shared text and for
            # nothing else (adding attachment-count keys would also activate
            # it for images/files it cannot save).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    entitlements:
      path: typvia-share/typvia-share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.typvia.mobile
    settings:
      base:
        PRODUCT_NAME: Typvia Share
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.share
        SWIFT_VERSION: "5.9"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
  # Test-only clone of the extension, embedded in the XCUITest host so the
  # keyboard tests run without building the Tauri app (bundle id must be
  # prefixed by its container app's id). Never shipped.
  typvia-keyboard-harness:
    templates: [keyboard-ext]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.kbtesthost.keyboard
  # Test-only host app: native text view + fixture snapshot writer for the
  # keyboard XCUITest (the Typvia WebView offers no reliable native field
  # for insertion assertions). Built only by the typvia-keyboard-uitests
  # scheme; never shipped.
  typvia-kb-testhost:
    type: application
    platform: iOS
    sources:
      - path: ../../../../../native/ios-keyboard-ext/TestHost
    info:
      path: typvia-kb-testhost/Info.plist
      properties:
        CFBundleDisplayName: KbTestHost
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        UILaunchScreen: {}
    entitlements:
      path: typvia-kb-testhost/typvia-kb-testhost.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.typvia.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.kbtesthost
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: typvia-keyboard-harness
        embed: true
  typvia-keyboard-uitests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../../../../native/ios-keyboard-ext/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.typvia.mobile.kbuitests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: typvia-kb-testhost
schemes:
  # One-command keyboard UI test run:
  #   xcodebuild test -project typvia-mobile.xcodeproj \
  #     -scheme typvia-keyboard-uitests \
  #     -destination 'platform=iOS Simulator,name=iPhone 16'
  typvia-keyboard-uitests:
    build:
      targets:
        typvia-kb-testhost: all
        typvia-keyboard-uitests: [test]
    test:
      targets: [typvia-keyboard-uitests]