name: Build iOS

# Manual only. The .ipa is built for a real device but left unsigned: no
# Apple Developer certificates exist yet, and none may ever live in the
# repository. An unsigned .ipa will not install as-is — it has to be
# re-signed against an Apple ID first, with the seven-day limit a free
# account carries — but it is a complete device build, which a simulator
# build is not.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Driven through the Tauri CLI rather than xcodebuild: the Rust phase
      # of the Xcode project depends on an option service the CLI hosts, so a
      # standalone xcodebuild invocation cannot complete the build.
      - name: Build unsigned device package
        run: pnpm --dir apps/mobile tauri ios build --target aarch64 --no-sign --ci

      # Both shapes are collected because an unsigned build may stop at the
      # .app rather than reaching the .ipa export step. Whichever appears is
      # the artifact; an empty upload means the build produced neither.
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: typvia-ios-unsigned
          path: |
            apps/mobile/src-tauri/gen/apple/build/**/*.ipa
            apps/mobile/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
