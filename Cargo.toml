[workspace]
resolver = "2"
# Throwaway spike crates live outside the workspace so root-level quality
# commands stay scoped to formal modules (spike code is exempt from lint).
exclude = ["apps/desktop/src-tauri", "apps/mobile/src-tauri", "spikes/injection"]
members = [
    "crates/core",
    "crates/crypto",
    "crates/search",
    "crates/sync",
    "crates/template",
    "crates/espanso-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
