[package]
name = "typvia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Typvia desktop application shell (Tauri host)"

[build-dependencies]
# Tauri build-time codegen: config validation, icon embedding, capability
# schema generation. Required by every Tauri host crate.
tauri-build = { version = "2", features = [] }

[dependencies]
# Application shell frozen by DEC-007 (tauri 2.x): window management and the
# IPC host the frontend talks to. No optional features until a task needs one.
tauri = { version = "2", features = [] }

[lints]
workspace = true
