# SPIKE (TASK-010): FFI integration cost probe — UniFFI vs hand-written C ABI.
# Throwaway — excluded from the root workspace; not to be merged into formal
# modules. The formal FFI layer lands with the decision recorded in DEC-006+.
[package]
name = "ffi-spike"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "ffi_spike"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "0.30", features = ["cli"] }
